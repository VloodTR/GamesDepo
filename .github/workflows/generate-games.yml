# VloodTR - GitHub Actions


name: Generate Games JSON

on:
  push:
    branches:
      - main
    paths:
      - '*.pck'
      - '*.PCK'
      - '.github/workflows/generate-games.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Generate Games Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Games JSON
        shell: bash
        run: |
          set -e

          TEMP=$(mktemp -d)
          INDEX=0

          while IFS= read -r -d '' FILE; do
            FILENAME=$(basename "$FILE")
            NAME="${FILENAME%.*}"
            NAME="${NAME^}"

            jq -n \
              --arg name "$NAME" \
              --arg pck "$FILENAME" \
              '{Name: $name, PCK: $pck}' \
              > "$TEMP/$INDEX.json"

            INDEX=$((INDEX + 1))
          done < <(
            find . -maxdepth 1 -type f -iname '*.pck' -print0 | sort -z
          )

          jq -s '{games: .}' "$TEMP"/*.json > games.json 2>/dev/null || echo '{"games":[]}' > games.json

          jq empty games.json

          rm -rf "$TEMP"

          echo "Games JSON generated successfully!"

      - name: Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add games.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update games.json"
          git push origin main
